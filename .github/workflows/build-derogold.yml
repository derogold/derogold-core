name: Build DeroGold

on:
  workflow_dispatch:
  push:
    branches:
      - "master"
      - "development"
  pull_request:
    branches:
      - "master"
      - "development"
  schedule:
    - cron: 0 0 * * 0

permissions:
  contents: read
  actions: write

defaults:
  run:
    shell: pwsh

jobs:
  build_derogold:
    name: ${{ matrix.build_preset }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    concurrency:
      group: build_derogold_${{ github.ref }}_${{ matrix.os }}_${{ matrix.arch }}_${{ matrix.compiler }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows is covered by the MSYS2 MinGW jobs below. There is no MSVC
          # job: with vcpkg gone there is no OpenSSL package source for MSVC,
          # so such a job would have nothing to link against.
          - os: windows-latest
            arch: x64
            compiler: gcc
            msys2_environment: MINGW64
            msys2_install: >-
              mingw-w64-x86_64-ccache
              mingw-w64-x86_64-cmake
              mingw-w64-x86_64-ninja
              mingw-w64-x86_64-toolchain
              mingw-w64-x86_64-openssl
            configure_preset: windows-x64-mingw-gcc-package
            build_preset: windows-x64-mingw-gcc-package
            run_cryptotest: true

          - os: windows-latest
            arch: x64
            compiler: clang
            msys2_environment: CLANG64
            msys2_install: >-
              mingw-w64-clang-x86_64-ccache
              mingw-w64-clang-x86_64-cmake
              mingw-w64-clang-x86_64-ninja
              mingw-w64-clang-x86_64-toolchain
              mingw-w64-clang-x86_64-openssl
            configure_preset: windows-x64-mingw-clang-package
            build_preset: windows-x64-mingw-clang-package
            run_cryptotest: true

          - os: ubuntu-22.04
            arch: x64
            compiler: gcc
            install: >-
              build-essential
              cmake
              git
              libssl-dev
              ninja-build
              pkg-config
            configure_preset: linux-x64-gcc-package
            build_preset: linux-x64-gcc-package
            run_cryptotest: true

          - os: ubuntu-22.04
            arch: arm64
            compiler: gcc
            install: >-
              cmake
              crossbuild-essential-arm64
              git
              libssl-dev
              ninja-build
              pkg-config
            configure_preset: linux-arm64-gcc-cross-package
            build_preset: linux-arm64-gcc-cross-package
            run_cryptotest: false

          - os: ubuntu-24.04
            arch: x64
            compiler: gcc
            install: >-
              build-essential
              cmake
              git
              libssl-dev
              ninja-build
              pkg-config
            configure_preset: linux-x64-gcc-package
            build_preset: linux-x64-gcc-package
            run_cryptotest: true

          - os: ubuntu-24.04
            arch: arm64
            compiler: gcc
            install: >-
              cmake
              crossbuild-essential-arm64
              git
              libssl-dev
              ninja-build
              pkg-config
            configure_preset: linux-arm64-gcc-cross-package
            build_preset: linux-arm64-gcc-cross-package
            run_cryptotest: false

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Program / Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install ${{ matrix.install }} -y

      - name: Install CMake
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "^4.3.1"

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          update: true
          install: ${{ matrix.msys2_install }}
          msystem: ${{ matrix.msys2_environment }}

      - name: Setup ccache
        uses: jianmingyong/ccache-action@v1.4.0
        with:
          ccache-key-prefix: ccache_cache_${{ runner.os }}_${{ matrix.arch }}_${{ matrix.compiler }}
          max-size: 150M

      - name: Build DeroGold (MSYS2)
        if: runner.os == 'Windows'
        working-directory: ${{ github.workspace }}
        shell: msys2 {0}
        run: |
          cmake --preset ${{ matrix.configure_preset }}
          cmake --build --preset ${{ matrix.build_preset }}

      - name: Build DeroGold (GCC/Clang)
        uses: lukka/run-cmake@v10.8
        if: runner.os != 'Windows'
        with:
          configurePreset: '${{ matrix.configure_preset }}'
          buildPreset: '${{ matrix.build_preset }}'

      - name: Collect Logs
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ${{ matrix.os }}-${{ matrix.arch }}-${{ matrix.compiler }}-cmake-logs
          path: ${{ github.workspace }}/build/**/*.log
          if-no-files-found: ignore

      - name: Upload Package
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ${{ matrix.os }}-${{ matrix.arch }}-${{ matrix.compiler }}-build
          path: |
            ${{ github.workspace }}/build/Packaging/*.zip
            ${{ github.workspace }}/build/Packaging/*.tar.gz
            ${{ github.workspace }}/build/Packaging/*.deb
          if-no-files-found: ignore

      - name: Run CryptoTest
        if: matrix.run_cryptotest
        run: |
          cd "${{ github.workspace }}/build/src"

          if ("${{ runner.os }}" -eq "Windows")
          {
            .\cryptotest.exe --help=false
          }
          elseif ("${{ runner.os }}" -eq "Linux")
          {
            ./cryptotest --help=false
          }
